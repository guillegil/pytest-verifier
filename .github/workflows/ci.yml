name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run test suite
        run: uv run --python ${{ matrix.python-version }} pytest -q

  oldest:
    name: test (oldest pytest and pluggy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Run test suite on pytest 7.0 and pluggy 1.2
        run: |
          uv venv --python 3.10 .venv-oldest
          VIRTUAL_ENV=.venv-oldest uv pip install . "pytest==7.0.1" "pluggy==1.2.0"
          .venv-oldest/bin/python -m pytest -q

  typing:
    name: typing (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Type-check the package and the documented usage
        run: uv run --python 3.12 --with mypy mypy

  package:
    name: package (build, then test the sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Check the metadata PyPI will show
        run: uvx twine check --strict dist/*

      # The same steps as the release build, so a pull request finds what would break it.
      - name: Run the sdist's tests against the wheel, oldest and newest pytest
        run: |
          mkdir sdist
          tar xzf dist/*.tar.gz -C sdist --strip-components=1
          for setup in "3.10 pytest==7.0.1 pluggy==1.2.0" "3.12 pytest"; do
            set -- $setup
            python="$1"; shift
            rm -rf sdist/.venv
            uv venv --python "$python" sdist/.venv
            # Name the interpreter: setup-uv exports UV_PYTHON=3.12, which beats VIRTUAL_ENV.
            uv pip install --python sdist/.venv/bin/python dist/*.whl "$@"
            (cd sdist && .venv/bin/pytest -q -p no:cacheprovider)
          done
