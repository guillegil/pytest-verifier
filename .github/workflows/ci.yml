name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run test suite
        run: uv run --python ${{ matrix.python-version }} pytest -q

  oldest:
    name: test (oldest pytest and pluggy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Run test suite on pytest 7.0 and pluggy 1.2
        run: |
          uv venv --python 3.10
          uv pip install . "pytest==7.0.1" "pluggy==1.2.0"
          .venv/bin/python -m pytest -q

  typing:
    name: typing (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Type-check the package and the documented usage
        run: uv run --python 3.12 --with mypy mypy

  package:
    name: package (build, then test the sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Run the sdist's tests against the wheel
        run: |
          mkdir sdist
          tar xzf dist/*.tar.gz -C sdist --strip-components=1
          uv venv --python 3.12 sdist/.venv
          VIRTUAL_ENV=sdist/.venv uv pip install dist/*.whl
          cd sdist && .venv/bin/pytest -q -p no:cacheprovider
