name: Release

# Builds a version once, tests the built wheel, then tags it, uploads it to PyPI and publishes a
# GitHub release with notes from CHANGELOG.md. Either push a tag `vX.Y.Z` (a full release), or
# run this workflow by hand and pick a target:
#   release   tag, PyPI and GitHub release (the default)
#   github    tag and GitHub release, without PyPI
#   testpypi  upload to TestPyPI only, without a tag (a trial before the real release)
#   tag       only create the tag (used for old versions)
# PyPI and TestPyPI uploads use Trusted Publishing: no token is stored. Each index must list
# this repository, this workflow file and the environment (pypi or testpypi) as a publisher.
# A run that failed half way can be run again: an existing tag on the same commit, files
# already on PyPI and an existing GitHub release are accepted.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v; must match pyproject.toml at ref"
        required: true
      ref:
        description: "Branch or commit to release"
        required: false
        default: main
      target:
        description: "What to publish"
        type: choice
        options: [release, github, testpypi, tag]
        default: release

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build and test the wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target: ${{ steps.version.outputs.target }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            target="$INPUT_TARGET"
          else
            version="${GITHUB_REF_NAME#v}"
            target=release
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH version"; exit 1
          fi
          case "$target" in
            release|github|testpypi|tag) ;;
            *) echo "::error::unknown target '$target'"; exit 1 ;;
          esac
          declared="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$declared" != "$version" ]; then
            echo "::error::pyproject.toml declares $declared, not $version"; exit 1
          fi
          if [ "$target" != tag ] && ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' heading"; exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "target=$target"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.version.outputs.target != 'tag'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        if: steps.version.outputs.target != 'tag'
        run: uv build --out-dir dist

      - name: Check the metadata PyPI will show
        if: steps.version.outputs.target != 'tag'
        run: uvx twine check --strict dist/*

      - name: Run the sdist's tests against the wheel, oldest and newest pytest
        if: steps.version.outputs.target != 'tag'
        run: |
          mkdir sdist
          tar xzf dist/*.tar.gz -C sdist --strip-components=1
          for setup in "3.10 pytest==7.0.1 pluggy==1.2.0" "3.12 pytest"; do
            set -- $setup
            python="$1"; shift
            rm -rf sdist/.venv
            uv venv --python "$python" sdist/.venv
            VIRTUAL_ENV=sdist/.venv uv pip install dist/*.whl "$@"
            (cd sdist && .venv/bin/pytest -q -p no:cacheprovider)
          done

      - name: Keep the built files
        if: steps.version.outputs.target != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: upload to TestPyPI
    needs: build
    if: needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pytest-verifier/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  tag:
    name: create the tag
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.target != 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Create the tag on the built commit
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          git fetch --tags --quiet origin
          if existing="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
            if [ "$existing" != "$SHA" ]; then
              echo "::error::tag $TAG already exists on $existing, not on $SHA"; exit 1
            fi
            echo "Tag $TAG already exists on $SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "pytest-verifier $VERSION" "$SHA"
          git push origin "refs/tags/$TAG"

  pypi:
    name: upload to PyPI
    needs: [build, tag]
    if: >-
      always() && needs.build.result == 'success' && needs.build.outputs.target == 'release'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-verifier/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: publish the GitHub release
    needs: [build, tag, pypi]
    if: >-
      always() && needs.build.result == 'success'
      && (needs.build.outputs.target == 'release' || needs.build.outputs.target == 'github')
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG already exists"
            exit 0
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
          fi
          gh release create "$TAG" dist/* --verify-tag --title "pytest-verifier $VERSION" --notes-file notes.md
