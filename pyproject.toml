[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-verifier"
version = "0.7.0"
description = "A pytest plugin providing soft assertions for test verification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillermo Gil" }]
requires-python = ">=3.9"
# pytest's own dependency; the hook wrappers need pluggy 1.2 or later.
dependencies = ["pytest>=7.0", "pluggy>=1.2"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/guillegil/pytest_verify"
Changelog = "https://github.com/guillegil/pytest_verify/blob/main/CHANGELOG.md"
Issues = "https://github.com/guillegil/pytest_verify/issues"

# The entry point names an importable module, so `-p pytest_verifier` and
# `-p no:pytest_verifier` work. The package loads `pytest_verifier.plugin`.
[project.entry-points.pytest11]
pytest_verifier = "pytest_verifier"

[tool.setuptools.packages.find]
# Only pytest_verifier: the pytest_verify name belongs to another project on PyPI.
include = ["pytest_verifier*"]

[tool.setuptools.package-data]
pytest_verifier = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite builds checks to inspect them; tests/test_unused.py turns the warning back on.
filterwarnings = ["ignore::pytest_verifier.UnusedCheckWarning"]

[tool.mypy]
strict = true
files = ["pytest_verifier", "tests/typing_usage.py"]
